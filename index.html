<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Hug Day</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        .container {
            max-width: 600px;
            background: rgba(255, 255, 255, 0.3);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(15px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1s ease-in-out;
            position: relative;
            z-index: 2;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        h1 {
            font-size: 30px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 10px rgba(255,255,255,0.8);
        }
        .hug-img {
            width: 200px;
            border-radius: 20px;
            margin: 15px 0;
            animation: float 2s infinite alternate;
        }
        @keyframes float {
            from { transform: translateY(0px); }
            to { transform: translateY(-10px); }
        }
        .hug-btn {
            background: #ff3366;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 20px;
            cursor: pointer;
            border-radius: 30px;
            margin-top: 15px;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 2;
        }
        .hug-btn:hover {
            background: #cc0052;
            transform: scale(1.1);
        }
        .hug-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: url('https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExZDdxajg3Z2U1em1vbTRqMnZjNDUwNTN0eG5qNXk4eDkxM2Iyb2lnYiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/MDJ9IbxxvDUQM/giphy.gif') no-repeat center;
            background-size: cover;
            display: none;
            z-index: 9999;
            animation: fadeInHug 1s ease-in-out;
        }
        @keyframes fadeInHug {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        .message {
            display: none;
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
        }
        .message.show {
            opacity: 1;
            transform: scale(1);
        }
        audio {
            display: none;
        }
    </style>
</head>
<body>
    <audio id="bg-music" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mpeg">
    </audio>
    <div class="container">
        <h1>Happy Hug Day, MADAM JI ! 💖</h1>
        <img class="hug-img" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExdWV2emlhYWZyc2x0YTNlMDQxcmEyaDhrdm16Y2p5cWh0bmlqMzZ6aSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/P3CZolxd8DeRy4g4fM/giphy.gif" alt="Cute Hug GIF">
        <p>Sending you a warm, tight, and loving hug on this special day! 🤗</p>
        <button class="hug-btn" onclick="sendHug()">🤗 Send Virtual Hug 🤗</button>
        <p class="message" id="hugMessage">*Tightest Virtual Hug Ever!* 🤗❤️</p>
    </div>
    <div class="hug-animation" id="hugAnimation"></div>
    <script>
        function sendHug() {
            const message = document.getElementById("hugMessage");
            message.classList.add("show");
            document.getElementById("bg-music").play();
            
            const hugAnimation = document.getElementById("hugAnimation");
            hugAnimation.style.display = "block";
            
            setTimeout(() => {
                hugAnimation.style.display = "none";
            }, 7200); // Show hug GIF for 7 seconds
        }
    </script>
</body>
</html>
